function legendHTML() {
  return ['working', 'waiting', 'idle', 'offline'].map((k) =>
    `<span class="legend" style="--s:${STATUS[k].color}"><i>${ic(STATUS[k].icon, 11)}</i>${STATUS[k].label}</span>`).join('')
    + `<span class="legend" style="--s:#CBD5E1"><i>${ic('pencil', 11)}</i>작은 네모는 업무 1건, 색은 맡은 직원</span>`;
}

function renderFloor() {
  const floor = $('floor');
  if (!data?.sessions) return;
  if (!data.sessions.length) {
    patch(floor, `<div class="empty room" style="grid-column:1/-1"><strong>열려 있는 세션이 없습니다.</strong>Orca에서 세션을 열면 이 배치도에 자리가 생깁니다.</div>`);
    return;
  }
  // While editing, keep the floor still so dragging and typing aren't interrupted by live updates.
  if (editMode && !floorDirty && floor._html) return;
  floorDirty = false;
  const active = document.activeElement;
  const focusSel = active?.dataset?.sel;
  const focusAct = active?.dataset?.act ? `[data-act="${active.dataset.act}"][data-key="${CSS.escape(active.dataset.key || '')}"]` : null;
  const changed = patch(floor, hallHTML() + floorItems().map((it) => (it.d ? roomHTML(it.d) : ceoHTML())).join('') + trayHTML());
  if (!changed) return;
  applyClamps(floor);
  const form = floor.querySelector('.room-form input, .room-form select');
  if (form && editing) form.focus();
  else if (focusAct) floor.querySelector(focusAct)?.focus();
  else if (focusSel) floor.querySelector(`[data-sel="${CSS.escape(focusSel)}"]`)?.focus();
}

// Rooms in display order: the saved custom order if there is one, otherwise rooms with people first,
// then project rooms, then support rooms. Rooms added later go after the custom ones.
function floorItems() {
  const weight = (d) => data.tasks.filter((t) => t.dept === d.key).length;
  const rank = (d) => (d.staff.length ? 0 : d.support ? 2 : 1);
  const rooms = data.departments.filter((d) => !d.hidden).sort((a, b) =>
    rank(a) - rank(b) || b.staff.length - a.staff.length || weight(b) - weight(a));
  const items = [{ key: CEO, order: data.layout?.ceoOrder }, ...rooms.map((d) => ({ key: d.key, d, order: d.order }))];
  if (!items.some((it) => it.order != null)) return items;
  return items.map((it, i) => [it, i])
    .sort((a, b) => (a[0].order ?? 1e6 + a[1]) - (b[0].order ?? 1e6 + b[1]))
    .map(([it]) => it);
}

async function layoutAction(body, doneMessage) {
  try {
    const res = await fetch('/api/departments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Agent-Office': '1' },
      body: JSON.stringify(body),
    });
    const out = await res.json().catch(() => ({ ok: false }));
    if (!out.ok) throw new Error(out.error || '');
    if (doneMessage) toast('check', doneMessage);
  } catch (err) {
    toast('x', `저장하지 못했습니다. ${err.message || '서버가 켜져 있는지 확인하세요.'}`);
  }
  refreshFloorUntil = Date.now() + 5000;
  etag = '';
  await poll(true);
}

function saveOrder(keys, focusAfter) {
  keys.forEach((k, i) => {
    if (k === CEO) data.layout.ceoOrder = i;
    else { const d = deptByKey(k); if (d) d.order = i; }
  });
  floorDirty = true;
  renderFloor();
  if (focusAfter) $('floor').querySelector(focusAfter)?.focus();
  layoutAction({ action: 'order', keys });
}

function handleAct(act, key) {
  const d = key && deptByKey(key);
  switch (act) {
    case 'edit-start': editMode = true; editing = null; break;
    case 'edit-done': editMode = false; editing = null; break;
    case 'cancel': editing = null; break;
    case 'rename': case 'delete': editing = { key, kind: act }; break;
    case 'left': case 'right': {
      const keys = floorItems().map((it) => it.key);
      const i = keys.indexOf(key), j = i + (act === 'left' ? -1 : 1);
      if (i < 0 || j < 0 || j >= keys.length) return;
      [keys[i], keys[j]] = [keys[j], keys[i]];
      saveOrder(keys, `[data-act="${act}"][data-key="${CSS.escape(key)}"]`);
      return;
    }
    case 'hide':
      if (d) d.hidden = true;
      layoutAction({ action: 'hide', key, hidden: true },
        `${d?.name || '부서'}를 숨겼습니다.${d?.staff.length ? ` 이 방의 직원 ${d.staff.length}명도 사무실 화면에서 안 보입니다.` : ''}`);
      break;
    case 'unhide': layoutAction({ action: 'hide', key, hidden: false }, '다시 보이게 했습니다.'); break;
    case 'restore': layoutAction({ action: 'restore', key }, '부서를 되살렸습니다.'); break;
    case 'reset-order':
      data.departments.forEach((x) => { x.order = null; });
      if (data.layout) data.layout.ceoOrder = null;
      layoutAction({ action: 'resetOrder' }, '기본 배치로 되돌렸습니다.');
      break;
    default: return;
  }
  floorDirty = true;
  renderFloor();
}

document.addEventListener('submit', (ev) => {
  const form = ev.target.closest('[data-form]');
  if (!form) return;
  ev.preventDefault();
  const key = form.dataset.key;
  const d = deptByKey(key);
  if (form.dataset.form === 'rename') {
    const name = form.elements.namedItem('name').value.trim();
    const mission = form.elements.namedItem('mission').value.trim();
    if (d && name) d.name = name;
    if (d) d.mission = mission;
    layoutAction({ action: 'update', key, name, mission }, name ? `"${name}"(으)로 바꿨습니다.` : '기본 이름으로 되돌렸습니다.');
  } else if (form.dataset.form === 'delete') {
    const select = form.elements.namedItem('target');
    const targetName = select.options[select.selectedIndex]?.text || '';
    layoutAction({ action: 'delete', key, mergeInto: select.value },
      `${d?.name || '부서'}를 지웠습니다. 업무는 ${targetName}(으)로 옮겼어요.`);
  }
  editing = null;
  floorDirty = true;
  renderFloor();
});

// Drag and drop between rooms (delegated, since the floor is redrawn as HTML).
{
  const floorEl = $('floor');
  const clearDrag = () => {
    dragKey = null;
    floorEl.querySelectorAll('.dragging, .drop-before, .drop-after')
      .forEach((el) => el.classList.remove('dragging', 'drop-before', 'drop-after'));
  };
  floorEl.addEventListener('dragstart', (ev) => {
    const room = ev.target.closest?.('[data-room][draggable="true"]');
    if (!room || !editMode || ev.target.closest('input, select, textarea, .room-form')) return;
    dragKey = room.dataset.room;
    ev.dataTransfer.effectAllowed = 'move';
    ev.dataTransfer.setData('text/plain', dragKey);
    room.classList.add('dragging');
  });
  floorEl.addEventListener('dragover', (ev) => {
    if (!dragKey) return;
    const room = ev.target.closest('[data-room]');
    if (!room || room.dataset.room === dragKey) return;
    ev.preventDefault();
    ev.dataTransfer.dropEffect = 'move';
    const r = room.getBoundingClientRect();
    const after = ev.clientX > r.left + r.width / 2;
    floorEl.querySelectorAll('.drop-before, .drop-after').forEach((el) => {
      if (el !== room) el.classList.remove('drop-before', 'drop-after');
    });
    room.classList.toggle('drop-after', after);
    room.classList.toggle('drop-before', !after);
  });
  floorEl.addEventListener('drop', (ev) => {
    if (!dragKey) return;
    ev.preventDefault();
    const room = ev.target.closest('[data-room]');
    if (room && room.dataset.room !== dragKey) {
      const after = room.classList.contains('drop-after');
      const keys = floorItems().map((it) => it.key).filter((k) => k !== dragKey);
      keys.splice(keys.indexOf(room.dataset.room) + (after ? 1 : 0), 0, dragKey);
      const moved = dragKey;
      clearDrag();
      saveOrder(keys);
      toast('move', `${moved === CEO ? '대표실' : deptByKey(moved)?.name || '방'} 자리를 옮겼습니다.`);
      return;
    }
    clearDrag();
  });
  floorEl.addEventListener('dragend', clearDrag);
}

/* ---------- timeline ---------- */
function niceStep(range) {
  const steps = [5, 10, 15, 30, 60, 120, 180, 360].map((m) => m * 60000);
  return steps.find((s) => range / s <= 8) || steps[steps.length - 1];
}
function renderFlow() {
  const el = $('flow');
  if (!data?.sessions?.length) { patch(el, ''); el.hidden = true; return; }
  el.hidden = false;
  const tasks = data.tasks;
  // Rounded to the minute so the chart is redrawn once a minute, not every second.
  const now = Math.ceil(Date.now() / 60000) * 60000;
  const endAt = (t) => t.endedAt || (t.state === 'running' ? now : t.lastAt);
  const start0 = Math.min(...tasks.map((t) => t.startedAt).filter(Boolean), now - 30 * 60000);
  const range = Math.max(now - start0, 10 * 60000);
  const start = start0 - range * 0.01;
  const span = now - start;
  const pct = (at) => ((at - start) / span) * 100;
  const step = niceStep(span);
  const ticks = [];
  for (let at = Math.ceil(start / step) * step; at <= now; at += step) ticks.push(at);

  const focused = document.activeElement?.dataset?.sel;
  const grid = ticks.map((at) => `<span class="gridline" style="left:${pct(at).toFixed(1)}%"></span>`).join('')
    + `<span class="nowline" style="left:calc(${pct(now).toFixed(1)}% - 1px)" title="지금"></span>`;
  const rows = data.sessions.map((s) => {
    const bars = tasks.filter((t) => t.sid === s.id && t.startedAt).map((t) => {
      const d = deptByKey(t.dept);
      const left = pct(t.startedAt), width = Math.max(pct(endAt(t)) - left, 0.35);
      const took = t.state === 'running' ? '' : ` ${dur(endAt(t) - t.startedAt)}`;
      const tip = `${taskTitle(t)}\n${d?.name || ''}, ${hhmm(t.startedAt)}부터${took}, ${TASK_STATE[t.state] || ''}${t.cost ? `, $${t.cost.toFixed(2)}` : ''}`;
      return `<button type="button" class="bar ${t.state}" data-sel="t:${esc(t.id)}" aria-pressed="${sel?.type === 't' && sel.id === t.id}"
        style="left:${left.toFixed(1)}%;width:${width.toFixed(1)}%;--d:${d?.color || '#888'}" title="${esc(tip)}" aria-label="${esc(tip)}"></button>`;
    }).join('');
    return `<div class="flow-name">${face(s)}<span>${clampHTML(`flow:${s.id}`, `${staffNo(s)}. ${esc(sessionTitle(s))}`, 2)}</span></div>
      <div class="lane">${grid}${bars}</div>`;
  }).join('');
  const used = data.departments.filter((d) => tasks.some((t) => t.dept === d.key));

  const changed = patch(el, `
    <div class="section-head"><h2>업무 흐름</h2><p>${hhmm(start0)}부터 지금까지, 막대 하나가 지시 1건</p></div>
    <div class="flow-body">
      <div></div>
      <div class="axis">${ticks.map((at) => `<span class="tick" style="left:${pct(at).toFixed(1)}%">${hhmm(at)}</span>`).join('')}</div>
      ${rows}
    </div>
    <div class="dept-key">${used.map((d) => `<span style="--d:${d.color}"><i></i>${esc(d.name)}</span>`).join('')}</div>`);
  if (changed) applyClamps(el);
  if (changed && focused) el.querySelector(`[data-sel="${CSS.escape(focused)}"]`)?.focus();
}

/* ---------- costs ---------- */
function renderCosts() {
  const el = $('costs');
  if (!data?.sessions?.length) { patch(el, ''); el.hidden = true; return; }
  el.hidden = false;
  const ss = data.sessions;
  const total = ss.reduce((a, s) => a + (sessionCost(s) || 0), 0);
  const byS = ss.slice().sort((a, b) => (sessionCost(b) ?? -1) - (sessionCost(a) ?? -1));
  const maxS = Math.max(...byS.map((s) => sessionCost(s) || 0), 0.0001);
  const depts = data.departments.filter((d) => d.cost > 0).sort((a, b) => b.cost - a.cost);
  const deptTotal = depts.reduce((a, d) => a + d.cost, 0);
  const maxD = Math.max(...depts.map((d) => d.cost), 0.0001);
  const pctOf = (v, t) => t ? `${Math.round((v / t) * 100)}%` : '';

  const sRows = byS.map((s) => {
    const c = sessionCost(s);
    return `<li><div role="button" tabindex="0" class="cost-row" data-sel="s:${esc(s.id)}">${face(s)}
      <span>${clampHTML(`cost:${s.id}`, `${staffNo(s)}. ${esc(sessionTitle(s))}`, 2, 'name')}
        <span class="meter"><i style="width:${((c || 0) / maxS * 100).toFixed(1)}%;--m:${pastel(s)}"></i></span></span>
      <span class="amt">${money(c)}<small>${c != null ? `${pctOf(c, total)}, 토큰 ${tokens(s.usage.tokensIn + s.usage.tokensOut)}` : PROVIDER[s.provider] || ''}</small></span>
    </div></li>`;
  }).join('');
  const dRows = depts.map((d) => `<li><div class="cost-row" style="--d:${d.color}"><span class="dept-dot">${ic(d.icon, 16)}</span>
      <span><span class="name">${esc(d.name)}</span>
        <span class="meter"><i style="width:${(d.cost / maxD * 100).toFixed(1)}%;--m:${d.color}"></i></span></span>
      <span class="amt">$${d.cost.toFixed(2)}<small>${pctOf(d.cost, deptTotal)}</small></span></div></li>`).join('');

  if (patch(el, `
    <div class="section-head"><h2>비용</h2><p>OpenCode 기록 기준, Claude Code 세션은 비용 기록이 없습니다</p></div>
    <div class="cost-total"><b>$${total.toFixed(2)}</b><span>열려 있는 세션 ${ss.length}개의 전체 비용</span></div>
    <div class="cost-cols">
      <div><h3>세션별 전체 비용</h3><ul>${sRows}</ul></div>
      <div><h3>부서별 비용 <small style="color:var(--fg-3);font-weight:400">24시간</small></h3>
        ${dRows ? `<ul>${dRows}</ul>` : '<p class="quiet">24시간 동안 기록된 비용이 없습니다.</p>'}</div>
    </div>`)) applyClamps(el);
}

/* ---------- side panel ---------- */
function mixHTML(tools) {
  const entries = Object.entries(tools || {}).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]);
  const total = entries.reduce((a, [, n]) => a + n, 0);
  if (!total) return '<p class="quiet">도구를 쓰지 않고 답한 업무입니다.</p>';
  return `<div class="mix" role="img" aria-label="도구 사용 비율">${entries.map(([k, n]) =>
      `<i style="flex:${n};--m:${(CAT[k] || CAT.other).color}" title="${(CAT[k] || CAT.other).label} ${n}회"></i>`).join('')}</div>
    <div class="mix-key">${entries.map(([k, n]) => {
      const c = CAT[k] || CAT.other;
      return `<span style="--m:${c.color}">${ic(c.icon, 13)}${c.label} ${num(n)}</span>`;
    }).join('')}</div>`;
}

function taskRow(t) {
  const d = deptByKey(t.dept);
  const state = t.state === 'running' ? `${ic('play', 11)}${live(t.startedAt)}`
    : `${ic(t.state === 'completed' ? 'check' : 'x', 12)}${dur(taskEnd(t) - t.startedAt)}`;
  return `<li><button type="button" class="task-row ${t.state}" data-sel="t:${esc(t.id)}" style="--d:${d?.color || '#888'}" title="${esc(d?.name || '')}">
    <i></i>${ic(KIND_ICON[t.kind] || 'code', 15)}<span>${esc(taskTitle(t))}</span><small>${state}${t.cost ? ` $${t.cost.toFixed(2)}` : ''}</small></button></li>`;
}

function sessionPanel(s) {
  const st = STATUS[s.status];
  const tasks = data.tasks.filter((t) => t.sid === s.id).slice().reverse();
  const since = activeSince(s);
  const stats = [
    ['briefcase', num(s.taskCount), '처리한 지시'],
    ['files', num(s.fileCount), '수정한 파일'],
    ['cpu', s.usage ? tokens(s.usage.tokensIn + s.usage.tokensOut) : '기록 없음', '사용한 토큰'],
    ['dollar', money(sessionCost(s)), '이 세션 비용'],
  ];
  const acts = (s.feed || []).filter((e) => !(e.kind === 'message' && (!e.text || e.role === 'reasoning'))).slice(0, 10);
  return `
    <div class="who">${face(s)}<div><h2>${clampHTML(`who:${s.id}`, esc(sessionTitle(s)), 3)}</h2><p>${staffNo(s)}번 직원, ${esc(who(s))}</p></div></div>
    <div class="state" style="--s:${st.color}">
      <span class="state-icon">${ic(statusIcon(s), 18)}</span>
      <div><b>${st.label}${since ? ` ${live(since)}째` : ''}</b>${clampHTML(`state:${s.id}`, activityHTML(s), 4)}</div>
    </div>
    <div class="stats">${stats.map(([i, v, l]) => `<div class="stat">${ic(i, 18)}<div><b>${v}</b><span>${l}</span></div></div>`).join('')}</div>
    <h3>도구 사용 <small>전체 업무 기준</small></h3>
    ${mixHTML(s.tools)}
    <h3>맡은 업무 <small>24시간, 최근 순</small></h3>
    ${tasks.length ? `<ul>${(showAllTasks ? tasks : tasks.slice(0, 8)).map(taskRow).join('')}</ul>
      ${tasks.length > 8 ? `<button type="button" class="more" data-more>${showAllTasks ? '최근 8건만 보기' : `${tasks.length}건 모두 보기`}</button>` : ''}`
      : '<p class="quiet">아직 맡은 업무가 없습니다.</p>'}
    <h3>최근 활동</h3>
    ${acts.length ? `<ul class="acts">${acts.map((e) => {
      const d = describe(e);
      const fail = e.state === 'failed' || (e.exitCode && e.exitCode !== 0);
      return `<li class="${e.state === 'running' ? 'running' : ''} ${fail ? 'fail' : ''}">${ic(d.icon, 15)}
        <div>${clampHTML(`act:${s.id}:${e.seq}`, `<b>${esc(d.verb)}${e.state === 'running' ? ' 중' : ''}</b><span>${esc(d.obj)}</span>`, 3)}</div><time>${hhmm(e.at)}</time></li>`;
    }).join('')}</ul>` : '<p class="quiet">기록이 없습니다.</p>'}`;
}

function taskPanel(t) {
  const s = sessionById(t.sid);
  const d = deptByKey(t.dept);
  const end = taskEnd(t);
  const stateChip = t.state === 'running' ? ['play', '#22C55E'] : t.state === 'completed' ? ['check', '#94A3B8'] : ['x', '#F87171'];
  const stats = [
    ['clock', t.state === 'running' ? live(t.startedAt) : dur(end - t.startedAt), '걸린 시간'],
    ['files', num(t.fileCount), '수정한 파일'],
    ['cpu', t.cost == null ? '기록 없음' : tokens(t.tokens), '사용한 토큰'],
    ['dollar', money(t.cost), '이 업무 비용'],
  ];
  return `
    <button type="button" class="back" data-sel="s:${esc(s.id)}">${ic('arrowLeft', 14)}${staffNo(s)}번 직원 정보로 돌아가기</button>
    <div class="chips">
      <span class="chip" style="--d:${d?.color || '#888'}"><i>${ic(d?.icon || 'code', 11)}</i>${esc(d?.name || '')}</span>
      <span class="chip" style="--d:${stateChip[1]}"><i>${ic(stateChip[0], 11)}</i>${TASK_STATE[t.state]}</span>
      <span class="chip">${face(s)}${staffNo(s)}번 직원</span>
    </div>
    <p class="task-title">${clampHTML(`task:${t.id}`, esc(taskTitle(t)), 4)}</p>
    <p class="task-time">${ic('clock', 13)}${hhmm(t.startedAt)} ~ ${t.state === 'running' ? '지금' : hhmm(end)}</p>
    <div class="stats">${stats.map(([i, v, l]) => `<div class="stat">${ic(i, 18)}<div><b>${v}</b><span>${l}</span></div></div>`).join('')}</div>
    <h3>도구 사용</h3>
    ${mixHTML(t.tools)}
    ${t.prompt ? `<h3>지시</h3><p class="quote">${esc(t.prompt)}</p>` : ''}
    ${t.reply ? `<h3>${t.state === 'running' ? '중간 보고' : '보고'}</h3><p class="quote">${esc(t.reply)}</p>` : ''}
    ${t.fileCount ? `<h3>수정한 파일 <small>${t.fileCount}개</small></h3>
      <div class="files">${t.files.map((f) => `<span class="file" title="${esc(f)}">${ic('file', 12)}${esc(base(f))}</span>`).join('')}</div>` : ''}`;
}

function renderPanel() {
  const panel = $('panel');
  if (!data?.sessions) return;
  let html;
  if (sel?.type === 't' && taskById(sel.id)) html = taskPanel(taskById(sel.id));
  else if (sel?.type === 's' && sessionById(sel.id)) html = sessionPanel(sessionById(sel.id));
  else html = '<p class="quiet">배치도에서 직원이나 업무 네모를 누르면 자세한 내용이 여기에 나옵니다.</p>';
  if (patch(panel, html)) applyClamps(panel);
}

/* ---------- CEO statistics (Apache ECharts) ---------- */
const FONT = "'Fira Sans', 'Pretendard Variable', Pretendard, sans-serif";
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const charts = {}, chartKeys = {};
const TOOLTIP = {
  backgroundColor: 'rgba(15, 23, 42, .96)', borderColor: 'rgba(148, 163, 184, .35)', padding: [8, 12],
  textStyle: { color: '#F8FAFC', fontFamily: FONT, fontSize: 12.5 },
  extraCssText: 'border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.5);',
};
const LEGEND = { top: 0, type: 'scroll', textStyle: { color: '#CBD5E1', fontFamily: FONT, fontSize: 12 }, itemWidth: 12, itemHeight: 8, icon: 'roundRect', pageTextStyle: { color: '#94A3B8' } };
const AXIS = {
  axisLine: { lineStyle: { color: 'rgba(148, 163, 184, .3)' } }, axisTick: { show: false },
  axisLabel: { color: '#94A3B8', fontSize: 11.5, fontFamily: FONT },
  splitLine: { lineStyle: { color: 'rgba(148, 163, 184, .08)' } },
  nameTextStyle: { color: '#94A3B8', fontFamily: FONT },
};
const usd = (v) => `$${Number(v || 0).toFixed(2)}`;
const STATE_COLOR = { completed: '#22C55E', interrupted: '#64748B', running: '#60A5FA' };

function draw(id, option) {
  const el = $(id);
  if (!window.echarts) {
    patch(el, '<div class="chart-missing">차트 라이브러리(Apache ECharts)를 불러오지 못했습니다.<br>인터넷 연결을 확인한 뒤 새로고침하세요.</div>');
    return;
  }
  const key = JSON.stringify(option);
  if (chartKeys[id] === key) return;
  chartKeys[id] = key;
  if (!charts[id]) {
    el.innerHTML = '';
    el._html = undefined;
    charts[id] = echarts.init(el, null, { renderer: 'canvas' });
  }
  charts[id].setOption({
    backgroundColor: 'transparent', animation: !REDUCED, animationDuration: 500,
    textStyle: { fontFamily: FONT, color: '#CBD5E1' },
    grid: { left: 8, right: 16, top: 40, bottom: 8, containLabel: true },
    ...option,
  }, { replaceMerge: ['series', 'xAxis', 'yAxis', 'legend', 'title'] });
}
const empty = (text) => ({ title: { text, left: 'center', top: 'middle', textStyle: { color: '#94A3B8', fontSize: 13, fontWeight: 400, fontFamily: FONT } }, series: [] });

function staffStats(s, tasks) {
  const mine = tasks.filter((t) => t.sid === s.id);
  const done = mine.filter((t) => t.state === 'completed');
  const cut = mine.filter((t) => t.state === 'interrupted');
  const durs = done.map((t) => taskEnd(t) - t.startedAt).filter((v) => v >= 0);
  const cost = mine.reduce((a, t) => a + (t.cost || 0), 0);
  return {
    mine, done: done.length, cut: cut.length,
    rate: done.length + cut.length ? done.length / (done.length + cut.length) : null,
    avg: durs.length ? durs.reduce((a, b) => a + b, 0) / durs.length : null,
    cost, hasCost: mine.some((t) => t.cost != null),
    files: new Set(mine.flatMap((t) => t.files)).size,
  };
}

function renderStats() {
  if (!data?.sessions) return;
  const tasks = data.tasks;
  const now = Math.floor(Date.now() / 60000) * 60000;
  const done = tasks.filter((t) => t.state === 'completed');
  const cut = tasks.filter((t) => t.state === 'interrupted');
  const running = tasks.filter((t) => t.state === 'running');
  const durs = done.map((t) => taskEnd(t) - t.startedAt).filter((v) => v >= 0);
  const avgDur = durs.length ? durs.reduce((a, b) => a + b, 0) / durs.length : null;
  const longest = done.slice().sort((a, b) => (taskEnd(b) - b.startedAt) - (taskEnd(a) - a.startedAt))[0];
  const cost24 = tasks.reduce((a, t) => a + (t.cost || 0), 0);
  const costed = tasks.filter((t) => t.cost != null).length;
  const rate = done.length + cut.length ? done.length / (done.length + cut.length) : null;

  const B = 30 * 60000;
  const starts = tasks.map((t) => t.startedAt).filter(Boolean);
  const b0 = Math.floor(Math.min(...starts, now) / B) * B;
  const nb = Math.floor((now - b0) / B) + 1;
  const cats = Array.from({ length: nb }, (_, i) => hhmm(b0 + i * B));
  const bucketOf = (t) => Math.min(nb - 1, Math.max(0, Math.floor((t.startedAt - b0) / B)));
  const perBucket = Array(nb).fill(0);
  tasks.forEach((t) => { if (t.startedAt) perBucket[bucketOf(t)]++; });
  const peak = perBucket.indexOf(Math.max(...perBucket));

  const kpi = (icon, value, label, sub, cls = '') =>
    `<div class="glass kpi ${cls}"><span class="kpi-icon">${ic(icon, 20)}</span><div><b>${value}</b><span>${label}</span><small>${sub}</small></div></div>`;
  patch($('stat-kpis'), [
    kpi('check', rate == null ? '-' : `${Math.round(rate * 100)}%`, '완료율', `완료 ${done.length}건, 중단 ${cut.length}건, 진행 중 ${running.length}건`, 'green'),
    kpi('clock', avgDur == null ? '-' : dur(avgDur), '평균 처리 시간', longest ? `가장 오래 걸린 업무 ${dur(taskEnd(longest) - longest.startedAt)}` : '완료한 업무가 없습니다'),
    kpi('dollar', usd(cost24), '24시간 비용', costed ? `업무당 평균 ${usd(cost24 / costed)}` : '비용 기록이 없습니다', 'money'),
    kpi('chart', perBucket[peak] ? cats[peak] : '-', '가장 바빴던 시간대', perBucket[peak] ? `30분 동안 업무 ${perBucket[peak]}건 시작` : '업무가 없습니다'),
  ].join(''));

  // 1. Cumulative cost
  const costLines = data.sessions.filter((s) => data.costSeries?.[s.id]?.length).map((s) => {
    const pts = data.costSeries[s.id].slice();
    pts.push([now, pts[pts.length - 1][1]]);
    return { name: `${staffNo(s)}번 직원`, type: 'line', showSymbol: false, smooth: 0.2, data: pts,
      lineStyle: { width: 2, color: pastel(s) }, itemStyle: { color: pastel(s) }, areaStyle: { color: pastel(s), opacity: 0.06 } };
  });
  const events = [];
  data.sessions.forEach((s) => (data.costSeries?.[s.id] || []).forEach(([t, c]) => events.push([t, s.id, c])));
  events.sort((a, b) => a[0] - b[0]);
  const lastBy = {}, totalLine = [];
  events.forEach(([t, id, c]) => { lastBy[id] = c; totalLine.push([t, +Object.values(lastBy).reduce((a, b) => a + b, 0).toFixed(4)]); });
  if (totalLine.length) totalLine.push([now, totalLine[totalLine.length - 1][1]]);
  draw('c-cost', costLines.length ? {
    tooltip: { ...TOOLTIP, trigger: 'axis', valueFormatter: usd },
    legend: LEGEND,
    xAxis: { ...AXIS, type: 'time', splitLine: { show: false }, axisLabel: { ...AXIS.axisLabel, formatter: '{HH}:{mm}', hideOverlap: true } },
    yAxis: { ...AXIS, type: 'value', axisLabel: { ...AXIS.axisLabel, formatter: '${value}' } },
    series: [...costLines, { name: '전체', type: 'line', showSymbol: false, data: totalLine,
      lineStyle: { width: 3, color: '#22C55E' }, itemStyle: { color: '#22C55E' }, areaStyle: { color: '#22C55E', opacity: 0.1 } }],
  } : empty('비용 기록이 있는 세션이 없습니다'));

  // 2. Cost by department
  const costDepts = data.departments.filter((d) => d.cost > 0).sort((a, b) => b.cost - a.cost);
  draw('c-dept-cost', costDepts.length ? {
    tooltip: { ...TOOLTIP, trigger: 'item', valueFormatter: usd },
    legend: { ...LEGEND, type: 'plain', top: 'auto', bottom: 0, left: 'center', width: '92%' },
    title: { text: usd(cost24), subtext: '24시간', left: 'center', top: '32%',
      textStyle: { color: '#F8FAFC', fontSize: 20, fontFamily: 'Fira Code' }, subtextStyle: { color: '#94A3B8', fontFamily: FONT } },
    series: [{ type: 'pie', radius: ['46%', '66%'], center: ['50%', '40%'], label: { show: false },
      itemStyle: { borderColor: '#1B2336', borderWidth: 3, borderRadius: 6 },
      data: costDepts.map((d) => ({ name: d.name, value: +d.cost.toFixed(4), itemStyle: { color: d.color } })) }],
  } : empty('24시간 동안 기록된 비용이 없습니다'));

  // 3. Workload by time of day
  const usedDepts = data.departments.filter((d) => tasks.some((t) => t.dept === d.key));
  const bucketCost = Array(nb).fill(0);
  tasks.forEach((t) => { if (t.startedAt) bucketCost[bucketOf(t)] += t.cost || 0; });
  draw('c-hourly', tasks.length ? {
    tooltip: { ...TOOLTIP, trigger: 'axis', axisPointer: { type: 'shadow' } },
    legend: LEGEND,
    xAxis: { ...AXIS, type: 'category', data: cats },
    yAxis: [
      { ...AXIS, type: 'value', name: '업무', minInterval: 1 },
      { ...AXIS, type: 'value', name: '비용', splitLine: { show: false }, axisLabel: { ...AXIS.axisLabel, formatter: '${value}' } },
    ],
    series: [
      ...usedDepts.map((d) => ({ name: d.name, type: 'bar', stack: 'n', barMaxWidth: 24, itemStyle: { color: d.color },
        data: perBucket.map((_, i) => tasks.filter((t) => t.dept === d.key && t.startedAt && bucketOf(t) === i).length) })),
      { name: '비용', type: 'line', yAxisIndex: 1, smooth: true, showSymbol: false, data: bucketCost.map((v) => +v.toFixed(2)),
        lineStyle: { color: '#F8FAFC', width: 1.5, type: 'dashed' }, itemStyle: { color: '#F8FAFC' }, tooltip: { valueFormatter: usd } },
    ],
  } : empty('24시간 동안 처리한 업무가 없습니다'));

  // 4. Outcomes
  draw('c-outcome', tasks.length ? {
    tooltip: { ...TOOLTIP, trigger: 'item', valueFormatter: (v) => `${v}건` },
    legend: { ...LEGEND, type: 'plain', top: 'auto', bottom: 0, left: 'center', width: '92%' },
    title: { text: rate == null ? '-' : `${Math.round(rate * 100)}%`, subtext: '완료율', left: 'center', top: '32%',
      textStyle: { color: '#F8FAFC', fontSize: 22, fontFamily: 'Fira Code' }, subtextStyle: { color: '#94A3B8', fontFamily: FONT } },
    series: [{ type: 'pie', radius: ['46%', '66%'], center: ['50%', '40%'], label: { show: false },
      itemStyle: { borderColor: '#1B2336', borderWidth: 3, borderRadius: 6 },
      data: [
        { name: '완료', value: done.length, itemStyle: { color: STATE_COLOR.completed } },
        { name: '중단', value: cut.length, itemStyle: { color: STATE_COLOR.interrupted } },
        { name: '진행 중', value: running.length, itemStyle: { color: STATE_COLOR.running } },
      ] }],
  } : empty('업무가 없습니다'));

  // 5. Tasks by department
  const deptOrder = usedDepts.slice().sort((a, b) => tasks.filter((t) => t.dept === a.key).length - tasks.filter((t) => t.dept === b.key).length);
  draw('c-dept-tasks', tasks.length ? {
    tooltip: { ...TOOLTIP, trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: (v) => `${v}건` },
    legend: LEGEND,
    xAxis: { ...AXIS, type: 'value', minInterval: 1 },
    yAxis: { ...AXIS, type: 'category', data: deptOrder.map((d) => d.name) },
    series: [['completed', '완료'], ['interrupted', '중단'], ['running', '진행 중']].map(([st, label]) => ({
      name: label, type: 'bar', stack: 'n', barMaxWidth: 18, itemStyle: { color: STATE_COLOR[st] },
      data: deptOrder.map((d) => tasks.filter((t) => t.dept === d.key && t.state === st).length) })),
  } : empty('업무가 없습니다'));

  // 6. Tools by employee
  const staffNames = data.sessions.map((s) => `${staffNo(s)}번 직원`);
  const toolSum = (s, k) => tasks.filter((t) => t.sid === s.id).reduce((a, t) => a + (t.tools?.[k] || 0), 0);
  const cats6 = Object.keys(CAT).filter((k) => data.sessions.some((s) => toolSum(s, k) > 0));
  draw('c-tools', cats6.length ? {
    tooltip: { ...TOOLTIP, trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: (v) => `${v}회` },
    legend: LEGEND,
    xAxis: { ...AXIS, type: 'value' },
    yAxis: { ...AXIS, type: 'category', data: staffNames, inverse: true },
    series: cats6.map((k) => ({ name: CAT[k].label, type: 'bar', stack: 'n', barMaxWidth: 18, itemStyle: { color: CAT[k].color },
      data: data.sessions.map((s) => toolSum(s, k)) })),
  } : empty('도구 사용 기록이 없습니다'));

  // 7. Duration histogram
  const BINS = [[0, 60e3, '1분 미만'], [60e3, 180e3, '1~3분'], [180e3, 600e3, '3~10분'], [600e3, 1800e3, '10~30분'], [1800e3, 3600e3, '30분~1시간'], [3600e3, Infinity, '1시간 이상']];
  const binCount = (list) => BINS.map(([lo, hi]) => list.filter((t) => { const v = taskEnd(t) - t.startedAt; return v >= lo && v < hi; }).length);
  draw('c-duration', done.length + cut.length ? {
    tooltip: { ...TOOLTIP, trigger: 'axis', axisPointer: { type: 'shadow' }, valueFormatter: (v) => `${v}건` },
    legend: LEGEND,
    xAxis: { ...AXIS, type: 'category', data: BINS.map((b) => b[2]), axisLabel: { ...AXIS.axisLabel, interval: 0, fontSize: 11 } },
    yAxis: { ...AXIS, type: 'value', minInterval: 1 },
    series: [
      { name: '완료', type: 'bar', stack: 'n', barMaxWidth: 26, itemStyle: { color: STATE_COLOR.completed }, data: binCount(done) },
      { name: '중단', type: 'bar', stack: 'n', barMaxWidth: 26, itemStyle: { color: STATE_COLOR.interrupted }, data: binCount(cut) },
    ],
  } : empty('끝난 업무가 없습니다'));

  // 8. Staff table
  const rows = data.sessions.map((s) => {
    const st = staffStats(s, tasks);
    const home = deptByKey(s.home);
    return `<tr data-sel="s:${esc(s.id)}">
      <td><span class="staff-name">${face(s)}<span><b>${staffNo(s)}번 직원</b>${clampHTML(`staff:${s.id}`, esc(sessionTitle(s)), 2)}</span></span></td>
      <td>${esc(home?.name || '')}</td>
      <td><span style="color:${STATUS[s.status].color}">${STATUS[s.status].label}</span></td>
      <td class="nc">${st.mine.length}건</td>
      <td class="nc"><span class="rate">${st.rate == null ? '-' : `${Math.round(st.rate * 100)}%`}<i><b style="width:${Math.round((st.rate || 0) * 100)}%"></b></i></span></td>
      <td class="nc">${st.avg == null ? '-' : dur(st.avg)}</td>
      <td class="nc">${num(st.files)}개</td>
      <td class="nc">${st.hasCost ? usd(st.cost) : '기록 없음'}</td>
      <td class="nc">${st.hasCost && st.mine.length ? usd(st.cost / st.mine.length) : '-'}</td>
    </tr>`;
  }).join('');
  const staffEl = $('staff-table');
  if (patch(staffEl, `<table class="staff-table">
    <thead><tr><th>직원</th><th>현재 부서</th><th>상태</th><th class="nc">업무</th><th class="nc">완료율</th>
      <th class="nc">평균 처리 시간</th><th class="nc">수정 파일</th><th class="nc">비용</th><th class="nc">업무당 비용</th></tr></thead>
    <tbody>${rows}</tbody></table>`)) applyClamps(staffEl);
}

let view = localStorage.getItem('agent-office.view') === 'stats' ? 'stats' : 'office';
function setView(v) {
  view = v;
  localStorage.setItem('agent-office.view', v);
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.view === v)));
  $('view-office').hidden = v !== 'office';
  $('kpis').hidden = v !== 'office';
  $('view-stats').hidden = v !== 'stats';
  render();
  if (v === 'stats') Object.values(charts).forEach((c) => c.resize());
}
window.addEventListener('resize', () => Object.values(charts).forEach((c) => c.resize()));
window.addEventListener('echarts-ready', () => { if (view === 'stats') renderStats(); });

/* ---------- plumbing ---------- */
function patch(el, html) {
  if (el._html === html) return false;
  el._html = html;
  el.innerHTML = html;
  return true;
}
function render() {
  renderHeader();
  if (view === 'stats') renderStats();
  else { renderFloor(); renderFlow(); renderCosts(); renderPanel(); }
  tick();
}

function toast(icon, text) {
  const box = document.createElement('div');
  box.innerHTML = `${ic(icon, 16)}<span>${esc(text)}</span>`;
  $('toast').appendChild(box);
  setTimeout(() => box.remove(), 6200);
}

function noticeChanges(sessions) {
  const ids = new Set(sessions.map((s) => s.id));
  if (known) {
    for (const s of sessions) if (!known.has(s.id)) toast('users', `새 세션이 자리를 잡았습니다: ${clip(s.name || '새 세션', 40)}`);
    for (const [id, name] of known) if (!ids.has(id)) toast('x', `세션이 닫혀 자리를 정리했습니다: ${clip(name || '세션', 40)}`);
  }
  known = new Map(sessions.map((s) => [s.id, s.name]));

  const allowed = 'Notification' in window && Notification.permission === 'granted';
  for (const s of sessions) {
    const prev = lastStatus.get(s.id);
    if (allowed && prev && prev !== s.status) {
      if (s.status === 'waiting') new Notification('결재 요청', { body: `${sessionTitle(s)}: ${describe(s.current).obj || '확인이 필요합니다'}`, tag: s.id });
      else if (s.status === 'idle' && ACTIVE.has(prev)) new Notification('업무 완료 보고', { body: sessionTitle(s), tag: s.id });
    }
    lastStatus.set(s.id, s.status);
  }
}

function ensureSelection() {
  const ok = (sel?.type === 's' && sessionById(sel.id)) || (sel?.type === 't' && taskById(sel.id));
  if (ok) return;
  const ss = data.sessions;
  const pick = ss.find((s) => s.status === 'waiting') || ss.find((s) => ACTIVE.has(s.status)) || ss[0];
  sel = pick ? { type: 's', id: pick.id } : null;
}

let etag = '';
let inFlight = false;
let lastPoll = 0;
async function poll(force = false) {
  if ((paused && !force) || inFlight) return;
  // In a background tab, check less often (still often enough for desktop alerts).
  if (!force && document.hidden && Date.now() - lastPoll < 10000) return;
  inFlight = true;
  lastPoll = Date.now();
  try {
    const res = await fetch('/api/state', { cache: 'no-store', headers: etag ? { 'If-None-Match': etag } : {} });
    if (res.status === 304) {
      lastOk = Date.now();
    } else {
      const next = await res.json();
      errorText = next.error || '';
      if (next.sessions) {
        etag = res.headers.get('ETag') || '';
        data = next;
        if (Date.now() < refreshFloorUntil) floorDirty = true;
        lastOk = Date.now();
        noticeChanges(next.sessions);
        ensureSelection();
      }
    }
  } catch { /* shown as stale in the header */ }
  inFlight = false;
  if (!document.hidden) render();
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { poll(); render(); } });

document.addEventListener('click', (ev) => {
  const toggle = ev.target.closest('[data-clamp]');
  if (toggle) {
    const key = toggle.dataset.clamp;
    if (expanded.has(key)) expanded.delete(key); else expanded.add(key);
    const box = toggle.parentElement;
    const target = box && [...box.querySelectorAll('.clamp[data-key]')].find((el) => el.dataset.key === key);
    if (target) applyClamps(box);
    return;
  }
  const act = ev.target.closest('[data-act]');
  if (act) { handleAct(act.dataset.act, act.dataset.key); return; }
  if (ev.target.closest('[data-more]')) { showAllTasks = !showAllTasks; renderPanel(); return; }
  const jump = ev.target.closest('[data-jump]');
  if (jump) { $(jump.dataset.jump).scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  const tab = ev.target.closest('[data-view]');
  if (tab) { setView(tab.dataset.view); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const el = ev.target.closest('[data-sel]');
  if (!el) return;
  const [type, ...rest] = el.dataset.sel.split(':');
  sel = { type, id: rest.join(':') };
  localStorage.setItem('agent-office.sel', JSON.stringify(sel));
  if (el.closest('#view-stats')) { setView('office'); return; }
  render();
  if (window.matchMedia('(max-width: 1280px)').matches && !el.closest('#panel')) $('panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

document.addEventListener('keydown', (ev) => {
  const el = ev.target;
  if (ev.key === 'Escape' && editMode) {
    handleAct(editing ? 'cancel' : 'edit-done');
    return;
  }
  if (el.classList?.contains('tab') && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')) {
    const tabs = [...document.querySelectorAll('.tab')];
    const nextTab = tabs[(tabs.indexOf(el) + (ev.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length];
    nextTab.focus();
    setView(nextTab.dataset.view);
    return;
  }
  if ((ev.key === 'Enter' || ev.key === ' ') && el.getAttribute?.('role') === 'button' && el.dataset.sel) {
    ev.preventDefault();
    el.click();
  }
});

$('logo').innerHTML = ic('building', 22);
document.querySelector('[data-view="office"].tab').innerHTML = `${ic('building', 16)}사무실 현황`;
document.querySelector('[data-view="stats"].tab').innerHTML = `${ic('chart', 16)}대표 통계`;
if (new URLSearchParams(location.search).get('view') === 'stats') view = 'stats';
if (new URLSearchParams(location.search).get('edit') === '1') { view = 'office'; editMode = true; }
setView(view);
const pauseBtn = $('pause');
function syncPause() {
  pauseBtn.setAttribute('aria-pressed', String(paused));
  pauseBtn.innerHTML = paused ? `${ic('play', 14)}갱신 다시 시작` : `${ic('pause', 14)}갱신 일시정지`;
}
pauseBtn.addEventListener('click', () => { paused = !paused; syncPause(); if (!paused) poll(); else renderHeader(); });
syncPause();

const notifyBtn = $('notify');
function syncNotifyBtn() {
  if (!('Notification' in window)) { notifyBtn.hidden = true; return; }
  const p = Notification.permission;
  notifyBtn.setAttribute('aria-pressed', String(p === 'granted'));
  notifyBtn.innerHTML = `${ic('bell', 14)}${p === 'granted' ? '데스크톱 알림 켜짐' : p === 'denied' ? '알림이 차단됨' : '데스크톱 알림 켜기'}`;
}
notifyBtn.addEventListener('click', async () => {
  if (Notification.permission === 'default') await Notification.requestPermission();
  syncNotifyBtn();
});
syncNotifyBtn();

poll();
setInterval(poll, POLL_MS);
setInterval(() => {
  if (document.hidden) return;
  if (data && !paused) render(); else renderHeader();
  tick();
}, 1000);
</script>
</body>
</html>
