<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>에이전트 사무실</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
/* Design system: UI UX Pro Max, "internal operations dashboard" -> Glassmorphism, dark slate + status green,
   Fira Code headings / Fira Sans body (Pretendard covers Hangul). */
:root {
  --bg: #0F172A;
  --card: rgba(27, 35, 54, 0.72);
  --card-solid: #1B2336;
  --muted: #272F42;
  --fg: #F8FAFC;
  --fg-2: #CBD5E1;
  --fg-3: #94A3B8;
  --border: rgba(148, 163, 184, 0.18);
  --border-strong: rgba(148, 163, 184, 0.32);
  --primary: #1E293B;
  --accent: #22C55E;
  --warn: #F59E0B;
  --danger: #EF4444;
  --ring: #F8FAFC;
  --radius: 14px;
  --head: 'Fira Code', 'Pretendard Variable', Pretendard, monospace;
  --body: 'Fira Sans', 'Pretendard Variable', Pretendard, 'Malgun Gothic', system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0; min-height: 100vh; color: var(--fg); font: 15px/1.55 var(--body); word-break: keep-all; overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(900px 500px at 8% -10%, rgba(34, 197, 94, 0.13), transparent 60%),
    radial-gradient(800px 600px at 95% 0%, rgba(96, 165, 250, 0.12), transparent 60%),
    radial-gradient(900px 700px at 50% 110%, rgba(167, 139, 250, 0.10), transparent 60%),
    var(--bg);
  background-attachment: fixed;
}
button { font: inherit; color: inherit; }
h1, h2, h3, p, ol, ul, dl, dd { margin: 0; }
ul, ol { list-style: none; padding: 0; }
.ic { flex: none; display: block; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }
[data-sel], .btn, .more { cursor: pointer; }

.glass {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 18px 40px -20px rgba(0, 0, 0, 0.6);
}
.wrap { max-width: 1720px; margin: 0 auto; padding: 0 28px; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-top: 24px; padding-bottom: 20px; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, #22C55E, #15803D); color: #052E16; }
.brand h1 { font-size: 23px; font-weight: 700; letter-spacing: -0.01em; }
.live { display: flex; align-items: center; gap: 8px; margin-top: 2px; font-size: 13px; color: var(--fg-3); }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 rgba(34, 197, 94, .6); animation: live 2s infinite; }
.live.paused i { background: var(--fg-3); animation: none; }
.live.stale i { background: var(--danger); animation: none; }
.live.stale { color: #FCA5A5; }
@keyframes live { 0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, .55); } 100% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); } }
.top-side { display: flex; align-items: center; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 10px;
  border: 1px solid var(--border-strong); background: rgba(255, 255, 255, 0.03); font-size: 13px; color: var(--fg-2);
  transition: background .18s, border-color .18s, color .18s;
}
.btn:hover { background: rgba(255, 255, 255, 0.08); color: var(--fg); }
.btn[aria-pressed="true"] { border-color: rgba(34, 197, 94, .5); color: #86EFAC; }
.clock { text-align: right; padding-left: 8px; }
.clock b { display: block; font-family: var(--head); font-size: 22px; font-weight: 600; line-height: 1.15; }
.clock span { font-size: 12.5px; color: var(--fg-3); }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi { display: flex; align-items: center; gap: 14px; padding: 16px 18px; }
.kpi-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: rgba(148, 163, 184, .12); color: var(--fg-2); }
.kpi b { display: block; font-family: var(--head); font-size: 26px; line-height: 1.1; font-weight: 700; }
.kpi span { font-size: 13px; color: var(--fg-3); }
.kpi.green .kpi-icon { background: rgba(34, 197, 94, .15); color: #4ADE80; }
.kpi.alert { border-color: rgba(245, 158, 11, .5); background: rgba(120, 75, 5, .28); }
.kpi.alert .kpi-icon { background: rgba(245, 158, 11, .2); color: #FBBF24; }
.kpi.alert b { color: #FCD34D; }
.kpi.money { text-align: left; border: 1px solid var(--border); }
.kpi.money:hover { border-color: var(--border-strong); }
.kpi.money .kpi-icon { background: rgba(96, 165, 250, .15); color: #93C5FD; }

/* Layout */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 18px; align-items: start; padding-bottom: 40px; }
.stack { display: grid; gap: 18px; min-width: 0; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 17px; font-weight: 700; }
.section-head p { font-size: 13px; color: var(--fg-3); }

/* Floor plan */
/* Rooms wrap into as many columns as fit; the 1px gaps draw the walls. */
.building {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); grid-auto-flow: row dense;
  gap: 1px; padding: 0; overflow: hidden; background: #172033;
}
.room { position: relative; min-width: 0; padding: 18px 18px 22px; background: #172033; outline: 1px solid var(--border-strong); }
.room.wide { grid-column: span 2; }
.room-head > div { min-width: 0; }
.hall {
  grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 18px;
  background: #131B2C; outline: 1px solid var(--border-strong); font-size: 12.5px; color: var(--fg-3);
}
.legend { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; color: var(--s); background: color-mix(in srgb, var(--s) 18%, transparent); }

.room-head { display: flex; gap: 12px; align-items: center; padding-right: 40px; }
.badge { width: 36px; height: 36px; flex: none; border-radius: 10px; display: grid; place-items: center; color: var(--d); background: color-mix(in srgb, var(--d) 16%, transparent); border: 1px solid color-mix(in srgb, var(--d) 35%, transparent); }
.room-head h2 { font-size: 16px; line-height: 1.3; font-weight: 700; }
.room-head p { font-size: 12.5px; color: var(--fg-3); }
.metrics { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; font-size: 12.5px; color: var(--fg-3); }
.metrics span { display: inline-flex; align-items: center; gap: 5px; }
.metrics b { color: var(--fg); font-weight: 600; font-family: var(--head); font-size: 12.5px; }

.desks { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); align-items: end; gap: 8px; margin-top: 14px; }
.desk {
  display: flex; flex-direction: column; align-items: center; min-width: 0; padding: 8px 6px 10px; cursor: pointer;
  border: 1px solid transparent; border-radius: 12px; background: transparent; transition: background .18s, border-color .18s;
}
.desk:hover { background: rgba(255, 255, 255, .04); }
.desk[aria-pressed="true"] { background: rgba(255, 255, 255, .06); border-color: var(--border-strong); }
.bubble {
  position: relative; display: block; width: 100%; min-height: 60px; margin-bottom: 12px; padding: 8px 10px 9px;
  border-radius: 12px; text-align: left; font-size: 12.5px; line-height: 1.4;
  background: #F8FAFC; color: #0F172A; --tail: #F8FAFC;
  box-shadow: 0 10px 22px -12px rgba(0, 0, 0, .8);
}
.bubble::after {
  content: ''; position: absolute; left: 86px; bottom: -8px;
  border: 8px solid transparent; border-bottom: 0; border-top-color: var(--tail);
}
.bubble-line { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 6px; align-items: start; font-weight: 600; }
.bubble-line .ic { margin-top: 2px; }
.bubble-line span { overflow-wrap: anywhere; }
.bubble-detail { display: block; margin-top: 3px; padding-left: 20px; font-size: 11.5px; color: #475569; overflow-wrap: anywhere; }
.bubble-detail.code { font-family: var(--head); font-size: 11px; }
.dots { display: inline-flex; gap: 3px; margin-left: 4px; vertical-align: middle; }
.dots i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: .35; animation: dot 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; }
.dots i:nth-child(3) { animation-delay: .4s; }
@keyframes dot { 30% { opacity: 1; transform: translateY(-2px); } 60% { opacity: .35; transform: none; } }
.bubble.wait { background: #FEF3C7; color: #78350F; --tail: #FEF3C7; box-shadow: 0 0 0 2px rgba(245, 158, 11, .55), 0 10px 22px -12px rgba(0, 0, 0, .8); }
.bubble.wait .bubble-detail { color: #92400E; }
.bubble.done { background: #DCFCE7; color: #14532D; --tail: #DCFCE7; }
.bubble.done .bubble-detail { color: #166534; }
.bubble.idle { background: #334155; color: var(--fg); --tail: #334155; }
.bubble.idle .bubble-detail { color: var(--fg-3); }
.bubble.off { background: rgba(51, 65, 85, .45); color: var(--fg-3); --tail: rgba(51, 65, 85, .45); box-shadow: none; }
.bubble.off .bubble-detail { color: #64748B; }
.scene { position: relative; width: 168px; height: 124px; }
.partition { position: absolute; left: 12px; right: 12px; top: 4px; bottom: 26px; border-radius: 14px 14px 4px 4px; background: var(--p); }
.person { position: absolute; left: 22px; bottom: 16px; width: 104px; height: 104px; }
.table {
  position: absolute; left: 0; right: 0; bottom: 0; height: 30px; border-radius: 6px;
  background: linear-gradient(#5B6B82, #3B4659); border-top: 1px solid rgba(255, 255, 255, .22);
  box-shadow: 0 8px 14px -8px rgba(0, 0, 0, .8);
}
.monitor {
  position: absolute; right: 12px; bottom: 22px; width: 56px; height: 38px; border-radius: 5px;
  display: grid; place-items: center; background: #0B1220; border: 2px solid #1E293B; color: var(--s);
  box-shadow: 0 0 22px -4px var(--s), inset 0 0 12px -6px var(--s);
}
.monitor::after { content: ''; position: absolute; left: 50%; bottom: -8px; width: 14px; height: 6px; margin-left: -7px; background: #1E293B; border-radius: 0 0 3px 3px; }
.num {
  position: absolute; left: 18px; top: 10px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px;
  display: grid; place-items: center; font-family: var(--head); font-size: 12px; font-weight: 600;
  background: rgba(15, 23, 42, .82); color: var(--fg);
}
.desk.is-offline .person, .desk.is-offline .partition { filter: grayscale(1); opacity: .45; }
.desk.is-offline .monitor { box-shadow: none; color: #334155; }
.desk.is-idle .monitor { box-shadow: none; }
.desk.is-waiting .monitor { animation: alarm 1.4s ease-in-out infinite; }
@keyframes alarm { 50% { box-shadow: 0 0 30px 2px var(--s), inset 0 0 14px -4px var(--s); } }
.plate { margin-top: 10px; max-width: 100%; font-size: 13.5px; font-weight: 600; text-align: center; overflow-wrap: anywhere; }
.sub { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--fg-3); }
.sub .ic { color: var(--s); }
.desk.is-waiting .sub { color: #FCD34D; }

.tiles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.tile {
  width: 28px; height: 28px; padding: 0; border: 0; border-radius: 7px; display: grid; place-items: center;
  background: var(--p); color: #0F172A; transition: transform .15s;
}
.tile:hover { transform: translateY(-1px); }
.tile.running { background: transparent; color: var(--p); box-shadow: inset 0 0 0 2px var(--p); }
.tile.interrupted { background: color-mix(in srgb, var(--p) 30%, transparent); color: var(--fg-2); }
.tile[aria-pressed="true"] { outline: 2px solid var(--ring); outline-offset: 2px; }
.quiet { margin-top: 8px; font-size: 13px; color: var(--fg-3); }

/* CEO office */
.room.ceo { background: #1A2438; }

/* Long text: first few lines, then a "전체 보기" button that expands it in place. */
.clamp { display: block; overflow: hidden; max-height: calc(var(--lines) * var(--lh, 1.45) * 1em); line-height: var(--lh, 1.45); }
.clamp.cut { -webkit-mask-image: linear-gradient(#000 calc(100% - 1.3em), transparent); mask-image: linear-gradient(#000 calc(100% - 1.3em), transparent); }
span.clamp.clamp { display: block; }
span.t.t { display: inline; }
.clamp.open { max-height: none; -webkit-mask-image: none; mask-image: none; }
.clamp-toggle {
  display: inline-block; margin-top: 2px; padding: 2px 0; border: 0; background: none; cursor: pointer;
  font-size: 12px; font-weight: 600; color: #93C5FD;
}
.clamp-toggle:hover { text-decoration: underline; }
.bubble .clamp-toggle { margin-left: 20px; color: #1D4ED8; }
.bubble.idle .clamp-toggle, .bubble.off .clamp-toggle { color: #93C5FD; }
.inbox { margin-top: 14px; }
.inbox h3 { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--fg-2); }
.inbox h3 .count { color: #FCD34D; font-family: var(--head); }
.inbox ul { margin-top: 8px; display: grid; gap: 6px; }
.memo {
  display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: center; width: 100%;
  padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: rgba(255, 255, 255, .03); text-align: left;
  transition: background .18s;
}
.memo:hover { background: rgba(255, 255, 255, .07); }
.memo.approve { border-color: rgba(245, 158, 11, .45); background: rgba(120, 75, 5, .25); }
.memo b { display: block; font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere; }
.memo span { display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--fg-3); }

.face {
  position: relative; display: block; flex: none; width: 32px; height: 32px; border-radius: 50%; overflow: hidden; background: var(--p);
}
.face img { position: absolute; left: -22%; top: -4%; width: 144%; height: 144%; }
.face.off { filter: grayscale(1); opacity: .5; }

/* Timeline */
.flow { padding: 18px 20px 16px; }
.flow-body { display: grid; grid-template-columns: 240px minmax(0, 1fr); margin-top: 12px; }
.flow-name {
  display: flex; align-items: center; gap: 9px; min-height: 44px; padding: 6px 12px 6px 0; min-width: 0;
  font-size: 13px; font-weight: 600; border-bottom: 1px solid rgba(148, 163, 184, .08);
}
.flow-name span { overflow-wrap: anywhere; }
.axis { position: relative; height: 24px; border-bottom: 1px solid var(--border); }
.tick { position: absolute; top: 0; transform: translateX(-50%); font-family: var(--head); font-size: 11.5px; color: var(--fg-3); white-space: nowrap; }
.gridline { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(148, 163, 184, .08); }
.nowline { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.lane { position: relative; min-height: 44px; border-bottom: 1px solid rgba(148, 163, 184, .08); }
.bar { position: absolute; top: 50%; margin-top: -9px; height: 18px; min-width: 5px; padding: 0; border: 0; border-radius: 4px; background: var(--d); transition: filter .15s; }
.bar:hover { filter: brightness(1.2); }
.bar.running { background: repeating-linear-gradient(135deg, var(--d) 0 6px, color-mix(in srgb, var(--d) 45%, transparent) 6px 12px); }
.bar.interrupted { background: color-mix(in srgb, var(--d) 35%, transparent); }
.bar[aria-pressed="true"] { outline: 2px solid var(--ring); outline-offset: 2px; z-index: 2; }
.dept-key { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 12.5px; color: var(--fg-3); }
.dept-key span { display: inline-flex; align-items: center; gap: 6px; }
.dept-key i { width: 10px; height: 10px; border-radius: 3px; background: var(--d); }

/* Costs */
.costs { padding: 18px 20px 20px; }
.cost-total { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; }
.cost-total b { font-family: var(--head); font-size: 30px; font-weight: 700; }
.cost-total span { font-size: 13px; color: var(--fg-3); }
.cost-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 16px; }
.cost-cols h3 { font-size: 13.5px; font-weight: 600; color: var(--fg-2); margin-bottom: 8px; }
.cost-row {
  display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%;
  padding: 7px 8px; margin: 0 -8px; border: 0; border-radius: 10px; background: transparent; text-align: left; transition: background .18s;
}
div.cost-row[data-sel]:hover { background: rgba(255, 255, 255, .05); }
.cost-row .name { display: block; font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere; }
.meter { display: block; height: 6px; margin-top: 5px; border-radius: 3px; background: rgba(148, 163, 184, .14); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--m); }
.cost-row .amt { text-align: right; font-family: var(--head); font-size: 14px; font-weight: 600; }
.cost-row .amt small { display: block; font-family: var(--body); font-size: 12px; font-weight: 400; color: var(--fg-3); }
.dept-dot { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--d); background: color-mix(in srgb, var(--d) 16%, transparent); }

/* Panel */
.panel { position: sticky; top: 16px; padding: 20px 22px 24px; max-height: calc(100vh - 32px); overflow: auto; }
.who { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; }
.who .face { width: 64px; height: 64px; }
.who h2 { font-size: 17px; line-height: 1.35; font-weight: 700; overflow-wrap: anywhere; }
.who p { font-size: 12.5px; color: var(--fg-3); }
.state {
  display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 12px; align-items: center; margin-top: 16px; padding: 10px 12px;
  border-radius: 12px; background: color-mix(in srgb, var(--s) 12%, transparent); border: 1px solid color-mix(in srgb, var(--s) 30%, transparent);
}
.state-icon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--s) 22%, transparent); color: var(--s); }
.state b { display: block; font-size: 14.5px; }
.state span { display: block; font-size: 12.5px; color: var(--fg-2); overflow-wrap: anywhere; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.stat { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .035); border: 1px solid var(--border); }
.stat .ic { color: var(--fg-3); }
.stat b { display: block; font-family: var(--head); font-size: 17px; line-height: 1.2; font-weight: 600; }
.stat span { font-size: 12px; color: var(--fg-3); }
.panel h3 { margin-top: 20px; font-size: 13.5px; font-weight: 600; color: var(--fg-2); display: flex; justify-content: space-between; align-items: baseline; }
.panel h3 small { font-size: 12px; font-weight: 400; color: var(--fg-3); }
.mix { display: flex; gap: 2px; height: 10px; margin-top: 8px; border-radius: 5px; overflow: hidden; }
.mix i { display: block; height: 100%; background: var(--m); }
.mix-key { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 12.5px; color: var(--fg-3); }
.mix-key span { display: inline-flex; align-items: center; gap: 5px; }
.mix-key .ic { color: var(--m); }
.task-row {
  display: grid; grid-template-columns: 3px 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%;
  padding: 8px 6px 8px 0; border: 0; border-top: 1px solid var(--border); background: transparent; text-align: left; font-size: 13px;
  transition: background .18s;
}
.task-row:hover { background: rgba(255, 255, 255, .04); }
.task-row > i { align-self: stretch; border-radius: 2px; background: var(--d); }
.task-row .ic { color: var(--fg-3); }
.task-row span { overflow-wrap: anywhere; }
.task-row small { white-space: nowrap; }
.task-row small { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--fg-3); font-family: var(--head); }
.task-row.running small { color: #4ADE80; }
.more { margin-top: 8px; padding: 4px 0; border: 0; background: transparent; font-size: 13px; font-weight: 600; color: #93C5FD; }
.more:hover { text-decoration: underline; }
.acts li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 7px 0; border-top: 1px solid var(--border); font-size: 13px; }
.acts .ic { color: var(--fg-3); margin-top: 2px; }
.acts li.running .ic { color: #4ADE80; }
.acts li.fail .ic { color: #F87171; }
.acts b { font-weight: 600; margin-right: 6px; }
.acts span { color: var(--fg-3); overflow-wrap: anywhere; }
.acts time { font-family: var(--head); font-size: 11.5px; color: var(--fg-3); }
.back { display: inline-flex; align-items: center; gap: 6px; margin-bottom: 14px; padding: 4px 0; border: 0; background: transparent; font-size: 13px; color: var(--fg-3); }
.back:hover { color: var(--fg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 4px; border-radius: 13px; font-size: 12.5px; background: rgba(255, 255, 255, .05); border: 1px solid var(--border); }
.chip i { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: var(--d); background: color-mix(in srgb, var(--d) 22%, transparent); }
.chip .face { width: 18px; height: 18px; }
.task-title { margin-top: 12px; font-size: 17px; line-height: 1.4; font-weight: 700; overflow-wrap: anywhere; }
.task-time { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 13px; color: var(--fg-3); }
.quote { margin-top: 8px; padding: 10px 12px; border-radius: 10px; background: rgba(255, 255, 255, .035); border: 1px solid var(--border); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg-2); }
.files { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.file { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border-radius: 8px; font-size: 12.5px; background: rgba(255, 255, 255, .05); border: 1px solid var(--border); }

/* Layout editing */
.hall .spacer { flex: 1; }
.hall .btn { height: 30px; padding: 0 12px; font-size: 12.5px; }
.btn.primary { background: rgba(34, 197, 94, .16); border-color: rgba(34, 197, 94, .5); color: #86EFAC; }
.btn.primary:hover { background: rgba(34, 197, 94, .26); color: #BBF7D0; }
.btn.danger { background: rgba(239, 68, 68, .14); border-color: rgba(239, 68, 68, .5); color: #FCA5A5; }
.btn.danger:hover { background: rgba(239, 68, 68, .24); color: #FECACA; }
.btn.ghost { border-color: transparent; }
.hall.editing-bar { background: rgba(96, 165, 250, .12); color: var(--fg-2); }
.hall.editing-bar > .ic { color: #93C5FD; }
.room.editing { cursor: grab; box-shadow: inset 0 0 0 2px rgba(96, 165, 250, .25); }
.room.editing:active { cursor: grabbing; }
.room.dragging { opacity: .4; }
.room.drop-before { box-shadow: inset 5px 0 0 #60A5FA, inset 0 0 0 2px rgba(96, 165, 250, .4); }
.room.drop-after { box-shadow: inset -5px 0 0 #60A5FA, inset 0 0 0 2px rgba(96, 165, 250, .4); }
.room-tools {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
  margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px dashed var(--border-strong);
}
.grip { color: var(--fg-3); }
.tool {
  display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--border-strong); background: rgba(255, 255, 255, .04); font-size: 12.5px; color: var(--fg-2);
  transition: background .18s, color .18s;
}
.tool:hover { background: rgba(255, 255, 255, .1); color: var(--fg); }
.tool.icon { width: 32px; padding: 0; justify-content: center; }
.tool-gap { width: 8px; }
.tool.danger:hover { background: rgba(239, 68, 68, .18); border-color: rgba(239, 68, 68, .5); color: #FCA5A5; }
.room-form {
  display: grid; gap: 10px; margin: 0 0 14px; padding: 14px; border-radius: 12px;
  background: rgba(15, 23, 42, .7); border: 1px solid rgba(96, 165, 250, .4); cursor: auto;
}
.room-form label { display: grid; gap: 4px; font-size: 12.5px; color: var(--fg-3); }
.room-form input, .room-form select {
  height: 38px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border-strong);
  background: #0F172A; color: var(--fg); font: inherit; font-size: 14px;
}
.room-form input:focus, .room-form select:focus { outline: 2px solid #60A5FA; outline-offset: 1px; }
.room-form p { font-size: 12.5px; color: var(--fg-2); }
.room-form .hint { color: var(--fg-3); }
.form-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.form-actions .btn { height: 34px; }
.tray {
  grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 16px 18px;
  background: #131B2C; outline: 1px solid var(--border-strong);
}
.tray h3 { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 13.5px; font-weight: 600; color: var(--fg-2); }
.tray ul { display: grid; gap: 6px; }
.tray li {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 6px 6px 12px;
  border-radius: 10px; background: rgba(255, 255, 255, .03); border: 1px solid var(--border); font-size: 13.5px;
}
.tray li > span { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }

/* Tabs */
.tabs { display: flex; gap: 6px; margin-bottom: 16px; }
.tab {
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 10px;
  border: 1px solid transparent; background: transparent; color: var(--fg-3); font-size: 14px; font-weight: 600; cursor: pointer;
  transition: background .18s, color .18s, border-color .18s;
}
.tab:hover { color: var(--fg); background: rgba(255, 255, 255, .04); }
.tab[aria-selected="true"] { color: var(--fg); background: var(--card); border-color: var(--border-strong); }
.ceo-link {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; height: 32px; padding: 0 12px; border-radius: 9px;
  border: 1px solid rgba(34, 197, 94, .45); background: rgba(34, 197, 94, .12); color: #86EFAC; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: background .18s;
}
.ceo-link:hover { background: rgba(34, 197, 94, .2); }

/* CEO statistics */
.stats-view { display: grid; gap: 16px; padding-bottom: 40px; }
.stat-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.stat-kpis .kpi small { display: block; font-size: 12px; color: var(--fg-3); }
.chart-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.chart-card { padding: 16px 18px 10px; min-width: 0; }
.chart-card.wide { grid-column: span 2; }
.chart-card.full { grid-column: 1 / -1; }
.chart-card h3 { font-size: 15px; font-weight: 700; }
.chart-card p { font-size: 12.5px; color: var(--fg-3); }
.chart { height: 300px; margin-top: 6px; }
.chart.short { height: 260px; }
.chart-missing { display: grid; place-items: center; height: 100%; color: var(--fg-3); font-size: 13px; text-align: center; }
.staff-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13.5px; }
.staff-table th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--fg-3); padding: 8px 10px; border-bottom: 1px solid var(--border-strong); }
.staff-table td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.staff-table td.nc { font-family: var(--head); text-align: right; white-space: nowrap; }
.staff-table th.nc { text-align: right; }
.staff-table tr[data-sel] { cursor: pointer; transition: background .18s; }
.staff-table tr[data-sel]:hover { background: rgba(255, 255, 255, .04); }
.staff-name { display: flex; align-items: center; gap: 10px; }
.rate { display: inline-flex; align-items: center; gap: 8px; }
.rate i { display: block; width: 60px; height: 6px; border-radius: 3px; background: rgba(148, 163, 184, .15); overflow: hidden; }
.rate i b { display: block; height: 100%; background: var(--accent); }

.toast { position: fixed; left: 24px; bottom: 24px; z-index: 30; display: grid; gap: 8px; pointer-events: none; }
.toast div { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: rgba(15, 23, 42, .92); border: 1px solid var(--border-strong); font-size: 14px; animation: fade 6s forwards; }
@keyframes fade { 0%, 85% { opacity: 1; } 100% { opacity: 0; } }
.empty { padding: 48px 28px; color: var(--fg-3); }
.empty strong { display: block; color: var(--fg); font-size: 18px; margin-bottom: 6px; }

@media (max-width: 1280px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; max-height: none; }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .chart-grid { grid-template-columns: 1fr 1fr; }
  .chart-card.wide { grid-column: 1 / -1; }
}
@media (max-width: 900px) {
  .chart-grid, .stat-kpis { grid-template-columns: 1fr; }
  .staff-table { display: block; overflow-x: auto; }
}
@media (max-width: 760px) {
  .wrap { padding: 0 12px; }
  .top { flex-direction: column; align-items: flex-start; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .building { grid-template-columns: 1fr; }
  .room.wide { grid-column: auto; }
  .tray { grid-template-columns: 1fr; }
  .flow-body { grid-template-columns: 120px minmax(0, 1fr); }
  .flow-name { font-size: 12px; }
  .cost-cols { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<header class="wrap top">
  <div class="brand">
    <span class="logo" id="logo"></span>
    <div>
      <h1>에이전트 사무실</h1>
      <p class="live" id="live"><i></i><span>연결 중</span></p>
    </div>
  </div>
  <div class="top-side">
    <button class="btn" id="pause" type="button" aria-pressed="false"></button>
    <button class="btn" id="notify" type="button" aria-pressed="false"></button>
    <div class="clock"><b id="clock-time"></b><span id="clock-date"></span></div>
  </div>
</header>

<nav class="wrap tabs" role="tablist" aria-label="화면 선택">
  <button class="tab" role="tab" type="button" data-view="office" aria-controls="view-office"></button>
  <button class="tab" role="tab" type="button" data-view="stats" aria-controls="view-stats"></button>
</nav>

<section class="wrap kpis" id="kpis" aria-label="현황 요약"></section>

<section class="wrap stats-view" id="view-stats" role="tabpanel" hidden>
  <div class="stat-kpis" id="stat-kpis"></div>
  <div class="chart-grid">
    <article class="glass chart-card wide"><h3>누적 비용 추이</h3><p>세션별로 쌓인 비용과 전체 합계</p><div class="chart" id="c-cost"></div></article>
    <article class="glass chart-card"><h3>부서별 비용</h3><p>24시간 동안 쓴 비용의 비율</p><div class="chart" id="c-dept-cost"></div></article>
    <article class="glass chart-card wide"><h3>시간대별 업무량</h3><p>30분마다 시작한 업무 수(막대)와 그 업무의 비용(선)</p><div class="chart" id="c-hourly"></div></article>
    <article class="glass chart-card"><h3>업무 결과</h3><p>완료, 중단, 진행 중인 업무</p><div class="chart" id="c-outcome"></div></article>
    <article class="glass chart-card"><h3>부서별 업무</h3><p>부서마다 맡은 업무와 결과</p><div class="chart short" id="c-dept-tasks"></div></article>
    <article class="glass chart-card"><h3>직원별 도구 사용</h3><p>24시간 업무에서 쓴 도구</p><div class="chart short" id="c-tools"></div></article>
    <article class="glass chart-card"><h3>업무 처리 시간</h3><p>업무 하나를 끝내는 데 걸린 시간</p><div class="chart short" id="c-duration"></div></article>
    <article class="glass chart-card full"><h3>직원별 성과</h3><p>24시간 기준, 줄을 누르면 사무실 현황에서 그 직원을 보여줍니다</p><div id="staff-table"></div></article>
  </div>
</section>

<main class="wrap layout" id="view-office" role="tabpanel">
  <div class="stack">
    <section class="glass building" id="floor" aria-label="사무실 배치도"></section>
    <section class="glass flow" id="flow" aria-label="업무 흐름"></section>
    <section class="glass costs" id="costs" aria-label="비용"></section>
  </div>
  <aside class="glass panel" id="panel" aria-live="polite"></aside>
</main>
<div class="toast" id="toast" aria-live="polite"></div>

  `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name] || ICON.code}</svg>`;

const CAT = {
  run: { label: '실행', icon: 'terminal', color: '#CBD5E1' },
  read: { label: '분석', icon: 'search', color: '#64748B' },
  edit: { label: '수정', icon: 'pencil', color: '#60A5FA' },
  web: { label: '조사', icon: 'globe', color: '#2DD4BF' },
  ask: { label: '질문', icon: 'bell', color: '#F59E0B' },
  agent: { label: '위임', icon: 'bot', color: '#F472B6' },
  other: { label: '기타', icon: 'code', color: '#334155' },
};
const KIND_ICON = { edit: 'pencil', run: 'terminal', read: 'search', web: 'globe', ask: 'bell', agent: 'bot', answer: 'message' };
const STATUS = {
  working: { label: '업무 중', color: '#22C55E', icon: 'terminal' },
  thinking: { label: '검토 중', color: '#22C55E', icon: 'bulb' },
  writing: { label: '보고 작성 중', color: '#22C55E', icon: 'doc' },
  waiting: { label: '결재 대기', color: '#F59E0B', icon: 'bell' },
  idle: { label: '대기', color: '#94A3B8', icon: 'coffee' },
  offline: { label: '퇴근', color: '#475569', icon: 'moon' },
  empty: { label: '지시 대기', color: '#94A3B8', icon: 'coffee' },
};
const ACTIVE = new Set(['working', 'thinking', 'writing', 'waiting']);
const PASTEL = ['#B6E3F4', '#C0AEDE', '#FFD5DC', '#D1D4F9', '#FFDFBF', '#C7F0D8', '#F9E79F', '#BDE0FE'];
const PROVIDER = { claude: 'Claude Code', opencode2: 'OpenCode', opencode: 'OpenCode 구버전', codex: 'Codex' };
const TASK_STATE = { running: '진행 중', completed: '완료', interrupted: '중단' };

let data = null;
let sel = JSON.parse(localStorage.getItem('agent-office.sel') || 'null');
{
  const raw = decodeURIComponent(location.hash.slice(1));
  if (/^[st]:/.test(raw)) sel = { type: raw[0], id: raw.slice(2) };
}
let known = null;
let lastStatus = new Map();
let lastOk = 0;
let errorText = '';
let paused = false;
let showAllTasks = false;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Collapses whitespace only; text is never cut short, it wraps instead.
const clip = (s) => String(s ?? '').replace(/\s+/g, ' ').trim();
const base = (p) => String(p ?? '').split(/[\\/]/).filter(Boolean).pop() || '';

function prettyModel(id) {
  if (!id) return '';
  const words = [], nums = [];
  for (const part of id.split('/').pop().split('-')) {
    if (/^\d+$/.test(part)) nums.push(part);
    else words.push(/^gpt$/i.test(part) ? 'GPT' : part.charAt(0).toUpperCase() + part.slice(1));
  }
  return [words.join(' '), nums.join('.')].filter(Boolean).join(' ');
}
function dur(ms) {
  if (ms == null || ms < 0) return '';
  const sec = Math.floor(ms / 1000);
  if (sec < 60) return `${sec}초`;
  const min = Math.floor(sec / 60);
  if (min < 60) return `${min}분`;
  const h = Math.floor(min / 60);
  return min % 60 ? `${h}시간 ${min % 60}분` : `${h}시간`;
}
const ago = (at) => !at ? '' : (Date.now() - at < 45000 ? '방금' : `${dur(Date.now() - at)} 전`);
const hhmm = (at) => at ? new Date(at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false }) : '';
const num = (n) => Number(n || 0).toLocaleString('ko-KR');
const tokens = (n) => n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${Math.round(n / 1e3)}K` : String(n || 0);
const money = (n) => n == null ? '기록 없음' : `$${n.toFixed(2)}`;

/* ---------- lookups ---------- */
const sessionById = (id) => data?.sessions?.find((s) => s.id === id);
const taskById = (id) => data?.tasks?.find((t) => t.id === id);
const deptByKey = (k) => data?.departments?.find((d) => d.key === k);
const staffNo = (s) => data.sessions.indexOf(s) + 1;
const pastel = (s) => PASTEL[(staffNo(s) - 1) % PASTEL.length];
const seed = (s) => s.id.slice(0, 8);
const sessionTitle = (s) => clip(s.name, 80) || '이름 없는 세션';
const taskTitle = (t) => clip(t.title, 120) || '제목 없는 업무';
const who = (s) => [prettyModel(s.model), PROVIDER[s.provider] || s.provider].filter(Boolean).join(', ');
const taskEnd = (t) => t.endedAt || (t.state === 'running' ? Date.now() : t.lastAt);
const pose = (s) => s.status === 'waiting' ? 'wave' : s.status === 'idle' ? 'phone' : 'plain';
const sessionCost = (s) => s.usage ? s.usage.cost : null;

function face(s, cls = '') {
  return `<span class="face ${s.status === 'offline' ? 'off' : ''} ${cls}" style="--p:${pastel(s)}"><img src="/avatar/${seed(s)}/plain.svg" alt="" loading="lazy" onerror="this.remove()"></span>`;
}

function describe(e) {
  if (!e) return { verb: '', obj: '', icon: 'code' };
  if (e.kind === 'tool-call') {
    const d = e.detail || '', line = d.split('\n')[0];
    const icon = CAT[e.cat]?.icon || 'code';
    switch (e.tool) {
      case 'shell': case 'bash': return { verb: '명령 실행', obj: clip(line, 80), icon };
      case 'read': return { verb: '파일 확인', obj: base(d), icon: 'file' };
      case 'edit': case 'write': case 'apply_patch': case 'multiedit': return { verb: '파일 수정', obj: base(d), icon };
      case 'grep': return { verb: '코드 검색', obj: clip(d, 60), icon };
      case 'glob': case 'list': return { verb: '파일 찾기', obj: clip(d, 60), icon };
      case 'webfetch': { let h = d; try { h = new URL(d).host; } catch {} return { verb: '웹 문서 확인', obj: h, icon }; }
      case 'websearch': return { verb: '웹 검색', obj: clip(d, 60), icon };
      case 'question': return { verb: '결재 요청', obj: clip(d.replace(/^Questions\s*/, ''), 60), icon };
      case 'skill': return { verb: '작업 지침 확인', obj: clip(d, 50), icon };
      case 'subagent': case 'task': return { verb: '업무 위임', obj: clip(d, 60), icon };
      default: return { verb: e.tool || '도구 사용', obj: clip(line, 60), icon };
    }
  }
  if (e.kind === 'diff') return { verb: '파일 변경', obj: base(e.path), icon: 'pencil' };
  if (e.kind === 'question') return { verb: '결재 요청', obj: clip(e.detail, 60), icon: 'bell' };
  if (e.kind === 'message') {
    if (e.role === 'user') return { verb: '지시', obj: clip(e.text, 90), icon: 'message' };
    if (e.role === 'assistant') return { verb: '보고', obj: clip(e.text, 90), icon: 'doc' };
    return { verb: '검토', obj: clip(e.text, 90), icon: 'bulb' };
  }
  return { verb: e.kind, obj: '', icon: 'code' };
}
const statusIcon = (s) => (s.status === 'working' && s.current) ? describe(s.current).icon : STATUS[s.status].icon;
// When the current stretch of work (or the wait for approval) began.
function activeSince(s) {
  if (!ACTIVE.has(s.status)) return null;
  return (s.status === 'waiting' ? (s.current?.at || s.activeSince) : s.activeSince) || null;
}
// Time labels are filled in by tick() every second, so the surrounding HTML stays unchanged
// and the screen is only rebuilt when the data itself changes.
const live = (at, mode = 'since') => at ? `<span class="t" data-t="${at}" data-m="${mode}"></span>` : '';
function tick(root = document) {
  root.querySelectorAll('.t[data-t]').forEach((el) => {
    const at = Number(el.dataset.t);
    const text = el.dataset.m === 'ago' ? ago(at) : dur(Date.now() - at);
    if (el.textContent !== text) el.textContent = text;
  });
}
function activityHTML(s) {
  if (s.status === 'offline') return `마지막 활동 ${live(s.lastActivity, 'ago')}`;
  return esc(shortActivity(s));
}
function shortActivity(s) {
  if (s.status === 'working' || s.status === 'waiting') {
    const d = describe(s.current);
    return d.obj ? `${d.verb}: ${d.obj}` : d.verb;
  }
  if (s.status === 'thinking') return '다음 작업을 정리하는 중';
  if (s.status === 'writing') return '결과를 보고서로 정리하는 중';
  if (s.status === 'idle') return '다음 지시를 기다리는 중';
  if (s.status === 'offline') return `마지막 활동 ${ago(s.lastActivity)}`;
  return 'Orca에서 첫 지시를 보내면 시작합니다';
}

/* ---------- header + KPIs ---------- */
function renderHeader() {
  const now = new Date();
  $('clock-time').textContent = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
  $('clock-date').textContent = now.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
  const live = $('live');
  const stale = !paused && (!lastOk || Date.now() - lastOk > STALE_MS);
  live.className = `live ${paused ? 'paused' : stale ? 'stale' : ''}`;
  live.querySelector('span').textContent = paused ? '갱신 일시정지됨'
    : stale ? '서버 연결 끊김. agent-office 폴더의 start.bat을 실행하세요.'
    : errorText || `실시간, ${Math.max(0, Math.round((Date.now() - lastOk) / 1000))}초 전 갱신`;
  if (!data?.sessions) return;

  const ss = data.sessions, ts = data.tasks;
  const busy = ss.filter((s) => ['working', 'thinking', 'writing'].includes(s.status)).length;
  const waiting = ss.filter((s) => s.status === 'waiting').length;
  const done = ts.filter((t) => t.state === 'completed').length;
  const total = ss.reduce((a, s) => a + (sessionCost(s) || 0), 0);
  const kpi = (icon, n, label, cls = '', tag = 'div', attrs = '') =>
    `<${tag} class="glass kpi ${cls}" ${attrs}><span class="kpi-icon">${ic(icon, 20)}</span><div><b>${n}</b><span>${label}</span></div></${tag}>`;
  patch($('kpis'), [
    kpi('users', ss.length, '열려 있는 세션'),
    kpi('play', busy, '지금 일하는 직원', busy ? 'green' : ''),
    kpi('bell', waiting, '결재 대기', waiting ? 'alert' : ''),
    kpi('check', done, '24시간 동안 끝낸 업무'),
    kpi('dollar', `$${total.toFixed(2)}`, `총 비용, 세션 ${ss.filter((s) => s.usage).length}개 합계`, 'money', 'button',
      'type="button" data-jump="costs"'),
  ].join(''));
  document.title = waiting ? `(${waiting}) 에이전트 사무실` : '에이전트 사무실';
}

/* ---------- floor plan ---------- */

/* What the character says in its speech bubble. */
function speech(s) {
  const c = s.current || {};
  const d = c.detail || '';
  if (s.status === 'waiting') {
    const n = c.count || 1;
    return { tone: 'wait', icon: 'bell', line: n > 1 ? `결재 부탁드려요! 질문 ${n}개` : '결재 부탁드려요!',
      detail: clip(describe(c).obj || 'Orca에서 확인해 주세요') };
  }
  if (s.status === 'working') {
    const file = (p) => base(p) || '파일을';
    if (c.kind === 'diff') return { tone: 'work', icon: 'pencil', line: `${file(c.path)} 고치는 중이에요`, detail: c.path || '' };
    switch (c.tool) {
      case 'shell': case 'bash': return { tone: 'work', icon: 'terminal', line: '명령어를 실행하고 있어요', detail: clip(d), code: true };
      case 'read': return { tone: 'work', icon: 'file', line: `${file(d)} 살펴보는 중이에요`, detail: d };
      case 'edit': case 'write': case 'apply_patch': case 'multiedit': return { tone: 'work', icon: 'pencil', line: `${file(d)} 고치는 중이에요`, detail: d };
      case 'grep': return { tone: 'work', icon: 'search', line: '코드에서 찾아보는 중이에요', detail: clip(d, 60), code: true };
      case 'glob': case 'list': return { tone: 'work', icon: 'search', line: '파일을 찾는 중이에요', detail: clip(d, 60), code: true };
      case 'webfetch': { let h = d; try { h = new URL(d).host; } catch {} return { tone: 'work', icon: 'globe', line: '웹 문서를 읽는 중이에요', detail: h }; }
      case 'websearch': return { tone: 'work', icon: 'globe', line: '인터넷에서 찾아보는 중이에요', detail: clip(d, 60) };
      case 'skill': return { tone: 'work', icon: 'book', line: '작업 지침을 확인하고 있어요', detail: clip(d, 60) };
      case 'subagent': case 'task': return { tone: 'work', icon: 'bot', line: '동료에게 일을 나눠 맡기는 중이에요', detail: clip(d, 60) };
      default: return { tone: 'work', icon: describe(c).icon, line: `${describe(c).verb} 중이에요`, detail: clip(describe(c).obj, 60) };
    }
  }
  if (s.status === 'thinking') {
    return { tone: 'work', icon: 'bulb', line: '어떻게 할지 생각하고 있어요', detail: c.kind === 'message' ? clip(c.text, 80) : '' };
  }
  if (s.status === 'writing') {
    return { tone: 'work', icon: 'doc', line: '보고서를 쓰고 있어요', detail: c.kind === 'message' ? clip(c.text, 80) : '' };
  }
  if (s.status === 'idle') {
    const t = taskById(s.currentTask);
    const end = t && (t.endedAt || t.lastAt);
    if (t && t.state === 'completed' && Date.now() - end < 15 * 60000) {
      return { tone: 'done', icon: 'check', line: '다 끝났어요! 보고 확인해 주세요', detail: taskTitle(t) };
    }
    if (t && t.state === 'interrupted' && Date.now() - end < 15 * 60000) {
      return { tone: 'idle', icon: 'x', line: '하던 일이 멈췄어요', detail: taskTitle(t) };
    }
    return { tone: 'idle', icon: 'coffee', line: '다음 지시를 기다리고 있어요', detail: end ? '마지막 업무' : '', agoAt: end };
  }
  if (s.status === 'offline') return { tone: 'off', icon: 'moon', line: '오늘은 퇴근했어요', detail: '마지막 활동', agoAt: s.lastActivity };
  return { tone: 'idle', icon: 'coffee', line: '첫 지시를 기다리고 있어요', detail: 'Orca에서 말을 걸어 주세요' };
}

/* Long text shows a few lines; applyClamps() adds a "전체 보기" button when it doesn't fit. */
const expanded = new Set();
const clampHTML = (key, html, lines, cls = '') =>
  `<span class="clamp ${cls} ${expanded.has(key) ? 'open' : ''}" data-key="${esc(key)}" style="--lines:${lines}">${html}</span>`;

function applyClamps(root) {
  root.querySelectorAll('.clamp[data-key]').forEach((el) => {
    const key = el.dataset.key;
    const next = el.nextElementSibling;
    const hasBtn = next && next.classList.contains('clamp-toggle');
    const open = expanded.has(key);
    el.classList.toggle('open', open);
    const overflows = open || el.scrollHeight > el.clientHeight + 2;
    el.classList.toggle('cut', !open && overflows);
    if (overflows && !hasBtn) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'clamp-toggle';
      btn.dataset.clamp = key;
      el.after(btn);
    } else if (!overflows && hasBtn) {
      next.remove();
    }
    const btn = el.nextElementSibling;
    if (btn && btn.classList.contains('clamp-toggle')) {
      btn.textContent = open ? '접기' : '전체 보기';
      btn.setAttribute('aria-expanded', String(open));
    }
  });
}

function bubbleHTML(s) {
  const b = speech(s);
  const typing = ['working', 'thinking', 'writing'].includes(s.status);
  return `<span class="bubble ${b.tone}">
    <span class="bubble-line">${ic(b.icon, 14)}<span>${esc(b.line)}${typing ? '<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>' : ''}</span></span>
    ${b.detail ? clampHTML(`bubble:${s.id}`, esc(b.detail) + (b.agoAt ? ` ${live(b.agoAt, 'ago')}` : ''), b.code ? 4 : 3, `bubble-detail ${b.code ? 'code' : ''}`) : ''}
  </span>`;
}

function deskHTML(s) {
  const st = STATUS[s.status];
  const pressed = sel?.type === 's' && sel.id === s.id;
  const since = activeSince(s);
  return `<div role="button" tabindex="0" class="desk is-${s.status}" data-sel="s:${esc(s.id)}" aria-pressed="${pressed}"
      style="--p:${pastel(s)};--s:${st.color}"
      aria-label="${staffNo(s)}번 직원, ${esc(sessionTitle(s))}, ${st.label}">
    ${bubbleHTML(s)}
    <span class="scene">
      <span class="partition"></span>
      <img class="person" src="/avatar/${seed(s)}/${pose(s)}.svg" alt="" onerror="this.remove()">
      <span class="table"></span>
      <span class="monitor">${ic(statusIcon(s), 18)}</span>
      <span class="num">${staffNo(s)}</span>
    </span>
    ${clampHTML(`plate:${s.id}`, esc(sessionTitle(s)), 2, 'plate')}
    <span class="sub">${ic(st.icon, 13)}${st.label}${since ? ` ${live(since)}` : ''}</span>
  </div>`;
}

function tileHTML(t) {
  const s = sessionById(t.sid);
  if (!s) return '';
  const pressed = sel?.type === 't' && sel.id === t.id;
  const took = t.state === 'running' ? '' : `, ${dur(taskEnd(t) - t.startedAt)}`;
  const tip = `${taskTitle(t)}\n${staffNo(s)}번 직원, ${TASK_STATE[t.state] || ''}${took}${t.cost ? `, $${t.cost.toFixed(2)}` : ''}`;
  return `<button type="button" class="tile ${t.state}" data-sel="t:${esc(t.id)}" aria-pressed="${pressed}"
    style="--p:${pastel(s)}" title="${esc(tip)}" aria-label="${esc(tip)}">${ic(KIND_ICON[t.kind] || 'code', 14)}</button>`;
}

/* ---------- layout editing: move, rename, hide, delete ---------- */
const CEO = '_ceo';
let editMode = false;
let editing = null;        // { key, kind: 'rename' | 'delete' }
let floorDirty = true;     // while editing, the floor only redraws when this is set
let refreshFloorUntil = 0;
let dragKey = null;

function roomOpen(key, cls, style) {
  // A room with an open form isn't draggable, so text in its inputs can be selected normally.
  const drag = editMode && editing?.key !== key ? 'draggable="true" aria-roledescription="옮길 수 있는 방"' : '';
  return `<div class="room ${cls} ${editMode ? 'editing' : ''}" data-room="${esc(key)}" ${drag} style="${style}">`;

function roomTools(key, name, editable) {

  const k = esc(key);

    <span class="grip" aria-hidden="true">${ic('grip', 16)}</span>
    <button type="button" class="tool icon" data-act="left" data-key="${k}" title="앞으로" aria-label="${esc(name)} 앞으로 옮기기">${ic('chevL', 15)}</button>
    <button type="button" class="tool icon" data-act="right" data-key="${k}" title="뒤로" aria-label="${esc(name)} 뒤로 옮기기">${ic('chevR', 15)}</button>
    ${editable ? `<span class="tool-gap"></span>
    <button type="button" class="tool icon" data-act="rename" data-key="${k}" title="이름 바꾸기" aria-label="${esc(name)} 이름 바꾸기">${ic('pencil', 14)}</button>

function roomForm(d) {

function hallHTML() {
  if (editMode) {
    return `<div class="hall editing-bar">${ic('move', 15)}
      <span>방을 끌어다 원하는 자리에 놓으세요. ◀ ▶ 버튼으로도 옮길 수 있어요. 편집하는 동안은 사무실 화면이 잠시 멈춥니다.</span>
      <span class="spacer"></span>
      <button type="button" class="btn" data-act="reset-order">${ic('undo', 14)}기본 배치로</button>
      <button type="button" class="btn primary" data-act="edit-done">${ic('check', 14)}편집 끝내기</button></div>`;
  }
  const hidden = data.departments.filter((d) => d.hidden).length + (data.layout?.hiddenIdle?.length || 0);
  return `<div class="hall">${legendHTML()}<span class="spacer"></span>
    ${hidden ? `<button type="button" class="btn ghost" data-act="edit-start">${ic('eyeOff', 14)}숨긴 부서 ${hidden}개</button>` : ''}
    <button type="button" class="btn" data-act="edit-start">${ic('move', 14)}배치 편집</button></div>`;
}

function trayHTML() {
  if (!editMode) return '';
  const hidden = [...data.departments.filter((d) => d.hidden).map((d) => ({ key: d.key, name: d.name })), ...(data.layout?.hiddenIdle || [])];
  const removed = data.layout?.removed || [];
  return `<div class="tray">
    <section><h3>${ic('eyeOff', 14)}숨긴 부서</h3>
      ${hidden.length ? `<ul>${hidden.map((h) => `<li><span>${esc(h.name)}</span>
        <button type="button" class="tool" data-act="unhide" data-key="${esc(h.key)}">${ic('eye', 13)}다시 보이기</button></li>`).join('')}</ul>`
        : '<p class="quiet">숨긴 부서가 없습니다.</p>'}</section>
    <section><h3>${ic('trash', 14)}지운 부서</h3>
      ${removed.length ? `<ul>${removed.map((r) => `<li><span>${esc(r.name)} ${ic('chevR', 12)} ${esc(r.targetName)}</span>
        <button type="button" class="tool" data-act="restore" data-key="${esc(r.key)}">${ic('undo', 13)}되살리기</button></li>`).join('')}</ul>`
        : '<p class="quiet">지운 부서가 없습니다.</p>'}</section>

}

function roomHTML(d) {
  const staff = d.staff.map(sessionById).filter(Boolean);
  const tasks = data.tasks.filter((t) => t.dept === d.key);
  return `${roomOpen(d.key, staff.length >= 2 ? 'wide' : '', `--d:${d.color}`)}

    ${roomForm(d)}
    <header class="room-head">
      <span class="badge">${ic(d.icon, 18)}</span>
      <div><h2>${esc(d.name)}</h2>${d.mission ? `<p>${esc(d.mission)}</p>` : ''}</div>

      <span>${ic('briefcase', 13)}업무 <b>${tasks.length}</b></span>
      ${d.fileCount ? `<span>${ic('files', 13)}파일 <b>${d.fileCount}</b></span>` : ''}
      ${d.workMs ? `<span>${ic('clock', 13)}<b>${dur(d.workMs)}</b></span>` : ''}

  </div>`;

function ceoHTML() {
  const ss = data.sessions;
  const waiting = ss.filter((s) => s.status === 'waiting');
  const reports = data.tasks
    .filter((t) => t.state !== 'running' && Date.now() - (t.endedAt || t.lastAt) < RECENT_REPORT_MS && sessionById(t.sid)?.currentTask === t.id)
    .sort((a, b) => (b.endedAt || b.lastAt) - (a.endedAt || a.lastAt));
  const memo = (s, title, line, cls, selector) =>
    `<li><div role="button" tabindex="0" class="memo ${cls}" data-sel="${selector}">${face(s)}<div>${clampHTML(`memo:${selector}`, `<b>${esc(title)}</b>`, 2)}<span>${line}</span></div></div></li>`;
  return `${roomOpen(CEO, 'ceo', '--d:#F8FAFC')}
    ${roomTools(CEO, '대표실', false)}
    <header class="room-head">
      <span class="badge">${ic('inbox', 18)}</span>
      <div><h2>대표실</h2><p>결재 요청과 완료 보고</p></div>
    </header>
    <button type="button" class="ceo-link" data-view="stats">${ic('chart', 14)}통계 보기</button>
    <section class="inbox">
      <h3>${ic('bell', 14)}결재 대기${waiting.length ? `<span class="count">${waiting.length}</span>` : ''}</h3>
      ${waiting.length ? `<ul>${waiting.map((s) => memo(s, describe(s.current).obj || sessionTitle(s),
          `${ic('clock', 12)}${live(activeSince(s))}째 기다리는 중`, 'approve', `s:${esc(s.id)}`)).join('')}</ul>`
        : '<p class="quiet">결재할 일이 없습니다.</p>'}
    </section>
    <section class="inbox">
      <h3>${ic('check', 14)}최근 보고</h3>
      ${reports.length ? `<ul>${reports.slice(0, 4).map((t) => memo(sessionById(t.sid), taskTitle(t),
          `${ic(t.state === 'completed' ? 'check' : 'x', 12)}${t.state === 'completed' ? '완료' : '중단'}, ${live(t.endedAt || t.lastAt, 'ago')}`, '', `t:${esc(t.id)}`)).join('')}</ul>`
